<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async programming</title>
</head>
<body>
    <h1>This is async programming</h1>
    <button id="stop">Stop</button>
</body>

<script>
    setTimeout(function() {
        console.log("Hello set time out");
        
    }, 2000)

    const changeText = function() {
        document.querySelector('h1').innerHTML = 'Changed using setTimeOut'
    }
    setTimeout(changeText, 2000)
</script>
</html>
