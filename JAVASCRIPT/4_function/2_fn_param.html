<!DOCTYPE html>
<html lang="en">
<head>
    <title>Function Params</title>
</head>
<body>
    <script>
        //Here a,b are parameters
        function sum(a,b){
            let sum = a+b;
            return sum;
        }
        console.log(sum(3,1)); //here 3,1 are arguments
        
    </script>
</body>
</html>
