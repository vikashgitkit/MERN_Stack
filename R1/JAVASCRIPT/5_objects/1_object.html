<!DOCTYPE html>
<html lang="en">
<head>
    <title>Objects</title>
</head>
<body>
    <script>
        let product = {
          company: 'Mango',
          price: 861,
          item_purchased: false,
          'item-name': 'T-shirt'
        };
        console.log(typeof(product));
        console.log(product);
        console.log(product.company); //Accesing values from objrct
        console.log(product.price);  
        
        product.company = 'Google'; //Updating object
        console.log(product.company);
        
        //Another way to access objects
        console.log('Another way:', product['price']);
        console.log('Another way:', product['item-name']);

        //delete the property from object
        delete product.company;
        console.log(product);

    </script>
</body>
</html>
