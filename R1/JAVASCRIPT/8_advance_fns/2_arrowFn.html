<!DOCTYPE html>
<html lang="en">
<head>
    <title>Arrow Function</title>
</head>
<body>
    <script>
        //if fn is anonymouse than we can use arrow fn so that we don't need to write function keyword
        let sum = (num1, num2) => {
            return num1 + num2;
        }
        console.log(sum(4,6));

        //if fn has single argument than don't need to add () and if fn body contains single line than don't need to use return and {}
        let sqr = num => num * num;
        console.log(sqr(5));
        
        
    </script>
</body>
</html>
