<!DOCTYPE html>
<html lang="en">
<head>
    <title>Object Reference</title>
</head>
<body>
    <script>
        //noraml memory management
        let a =5;
        let b =a;
        console.log(`a=${a}, b=${b}`);
        a = 8;
        console.log(`a=${a}, b=${b}`);

        //here x is reference of this object
        let x ={num:7};
        let y = x;
        console.log(`x=${x.num}, y=${y.num}`);
        x.num = 9;
        console.log(`x=${x.num}, y=${y.num}`);
        
    </script>
</body>
</html>
