<!DOCTYPE html>
<html lang="en">
<head>
    <title>Event Listener</title>
</head>
<body>
    <button id="btn">Click me</button>
    <script>

     let btnEle = document.querySelector('#btn');
     btnEle.addEventListener('click', event => console.log('I am clicked')
     );
    </script>
</body>
</html>
