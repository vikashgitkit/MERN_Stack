<!DOCTYPE html>
<html lang="en">
<head>
    <title>Event Listener</title>
</head>
<body>
    <button id="btn">Click me</button>
    <script>

     let btnEle = document.querySelector('#btn');
    //  btnEle.addEventListener('click', event => console.log('I am clicked')
    //  );
   
     //----------------OR---------------
       let behaviour = event => console.log("I am also clicked!");
     btnEle.addEventListener('click', behaviour);

     // we can also add the multiple event listener
     let printDate = event => console.log(new Date());
     btnEle.addEventListener('click', printDate);
      
     //We can also remove event listener
     btnEle.removeEventListener('click', behaviour);
    </script>
</body>
</html>
