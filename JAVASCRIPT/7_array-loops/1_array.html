<!DOCTYPE html>
<html lang="en">
<head>
    <title>Array</title>
</head>
<body>
    <script>

        let nums = [12,44,32,18,94];
        console.log(nums);
        console.log(nums[3]);
        console.log(nums.length);//op-> 5
        

        let nums1 = [32, true, null, 'Steve'];
        console.log(nums1[2]);
        console.log(typeof nums1);//op->object
        
        console.log(Array.isArray(nums1)); //op-> True
        
        
    </script>
    
</body>
</html>
