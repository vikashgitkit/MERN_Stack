<body>
    <script>
        function evenOdd(a){
            let result = a%2;
            if(result == 0){
                return 'Even';
            } else {
                return 'Odd';
            }
        }
        console.log(evenOdd(4));


        function greater(a,b){
            if(a>b){
                return a;
            } else{
                return b;
            }
        }
        console.log(greater(13,22));
    </script>
</body>
