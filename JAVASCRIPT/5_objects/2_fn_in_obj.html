<!DOCTYPE html>
<html lang="en">
<head>
    <title>More about object</title>
</head>
<body>
    <script>
        //Creating anonymus method inside obj
    let product = {
          company: 'Mango',
          price: 861,
          item_purchased: false,
          'item-name': 'T-shirt',
          displayPrice: function(){
            console.log(`Price of the product is ${product.price}`);
            
          }
        };

        product.displayPrice();
        </script>
</body>
</html>
