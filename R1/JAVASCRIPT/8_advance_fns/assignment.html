<!DOCTYPE html>
<html lang="en">
<head>
    <title>Assignment</title>
    <style>
        .btn{
            height: 20px;
            width: 80px;
            font-size: 15px;
            background-color: rgb(205, 54, 54);
            color: white;
            border: none;
            border-radius: 4px;
        }

        .js-size-double{
            height: 40px;
            width: 160px;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <!-- <button class="btn" onclick="setTimeout(doubleTheSize, 2000);">Click me</button> -->
      <button class="btn">Click me</button>
    <script>

        let btnEle = document.querySelector('.btn');
        btnEle.addEventListener('click', event => {
            setTimeout(doubleTheSize, 2000);
        });

        function doubleTheSize() {
            let btnEle = document.querySelector('.btn');
            btnEle.classList.add('js-size-double');
        }
        let multiply = (a,b) => a * b;
        console.log(multiply(4,5));

        let printGreet = () => console.log("Hello");
        let runTwice = inputFn => {
            inputFn();
            inputFn();
        }
        runTwice(printGreet);
        
        
        let sum = 0;
        let arr = [3,4,1,9,5];
        arr.forEach(num => sum += num);
        console.log(`sum of array elements is: ${sum}`);
        
        let sqr = arr.map(num => num * num);
        console.log(`Square is:${sqr}`);
        
    </script>
</body>
</html>
