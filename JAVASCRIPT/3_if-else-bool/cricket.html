<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cricket Game</title>
    <style>
        body{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Bat Ball Stump Game</h1>
    <button onclick="
    const usrChoiceMsg = 'You have chosen Bat';

    //This option is select by computer
    let randNum = Math.random()*3;
    let computerChoice;
    if(randNum > 0 && randNum <= 1) {
        computerChoice = 'Bat';
   
    } else if(randNum > 1 && randNum<= 2){
        computerChoice = 'Ball';
    } else{
        computerChoice = 'Stump';
    }
   
    const computerChoiceMsg = `Computer choice is ${computerChoice}`;

     let resultMsg;
    if(computerChoice === 'Ball'){
        resultMsg='User won';
        
    }else if(computerChoice === 'Bat'){
        resultMsg=`it's a tie`;
        
    } else{
        resultMsg='Computer Won';
        
    }
    
    alert(`${usrChoiceMsg} and ${computerChoiceMsg} result is: ${resultMsg}`);
    
    ">Bat</button>
    <button>Ball</button>
    <button>Stump</button>

    <script>

    </script>
</body>
</html>
