<!DOCTYPE html>
<html lang="en">
<head>
    <title>More about object</title>
</head>
<body>
    <script>
        //Creating anonymus method inside obj
    let product = {
          company: 'Mango',
          price: 861,
          item_purchased: false,
          'item-name': 'T-shirt',
          displayPrice: function(){
            console.log(`Price of the product is ${this.price}`);
            
          }
        };

        product.displayPrice();

        // Console and Math is also object and log, random are method of these objects
        // Like-> console.log();
        //     Math.random


        //Autoboxing
        console.log('This is KG coding'.toUpperCase);
        console.log('This is KG coding'.replace('This is replaced through autoboxing'));
        
        
        </script>
</body>
</html>
