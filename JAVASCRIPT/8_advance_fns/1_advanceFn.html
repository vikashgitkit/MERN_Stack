<!DOCTYPE html>
<html lang="en">
<head>
    <title>Advance Function</title>
</head>
<body>
    <script>
        //Anonymouse function: Here sum is a variable not a fn so it can also be passed as parameter to other fn
        let sum = function(num1, num2) {
            return num1 + num2;
        }
        
        //Assigning refrence of sum in newsum
        let newSum = sum;
        console.log(sum(2,3));//op-> 5
        console.log(newSum(4,5)); //op->9
        
        //((4 + 5) + 9)
        let sumThreeNum = function(num1, num2, num3, sumTwoNum) {
            let sum1 = sumTwoNum(num1, num2);
            return sumTwoNum(sum1, num3);
        }

        console.log(sumThreeNum(4,5,8, sum));//Here sum is passing as argument
        
        
    </script>
</body>
</html>
